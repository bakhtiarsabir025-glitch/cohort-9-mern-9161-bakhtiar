name: SonarCloud Analysis
on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22  # Changed from 20 to 22

      - name: Install backend deps & run tests
        run: |
          cd backend
          npm ci
          npm test -- --coverage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: "7d"
          NODE_ENV: "development"
          PORT: "5000"

      - name: Install frontend deps & run tests
        run: |
          cd frontend
          npm ci
          npm run test:coverage

      - name: Verify coverage files exist
        run: |
          echo "Checking backend coverage..."
          ls -la backend/coverage/lcov.info || echo "Backend coverage not found"
          echo "Checking frontend coverage..."
          ls -la frontend/coverage/lcov.info || echo "Frontend coverage not found"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}